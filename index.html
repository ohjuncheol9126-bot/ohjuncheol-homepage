<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>바이브 코더 | 자기소개</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0b1020;
        --surface: rgba(20, 29, 52, 0.78);
        --text: #f4f7ff;
        --muted: #a9b5cf;
        --accent: #7dd3fc;
        --accent-strong: #c4b5fd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        font-family: "D2Coding", "Malgun Gothic", Consolas, monospace;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 20%, rgba(125, 211, 252, 0.16), transparent 32%),
          radial-gradient(circle at 84% 78%, rgba(196, 181, 253, 0.14), transparent 30%),
          var(--background);
      }

      main {
        width: min(100%, 720px);
        padding: clamp(32px, 8vw, 72px);
        position: relative;
        isolation: isolate;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        animation: appear 700ms ease-out both;
      }

      main::before {
        content: "";
        width: 96px;
        height: 4px;
        position: absolute;
        top: 0;
        left: 40px;
        border-radius: 0 0 4px 4px;
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      }

      .eyebrow {
        margin: 0 0 20px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "D2Coding", "Malgun Gothic", sans-serif;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .intro {
        max-width: 30rem;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.8;
      }

      .signature {
        margin: 48px 0 0;
        color: var(--text);
        font-size: 0.9rem;
      }

      .signature span {
        color: var(--accent-strong);
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        main {
          border-radius: 18px;
        }

        main::before {
          left: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Hello, world</p>
      <h1>바이브 코더</h1>
      <p class="intro">AI와 함께 만드는 첫 번째 웹페이지</p>
      <p class="signature"><span>01</span> 작은 아이디어에서 시작합니다.</p>
    </main>
  </body>
</html>
